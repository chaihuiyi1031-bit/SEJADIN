<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>我的互動地圖 - 解鎖關卡</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* ========== 原有全部样式（100% 保留）========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .modal-rectangle {
            background-color: #ffffff;
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            max-width: 95vw;
        }
        .modal-squares {
            display: flex;
            flex-direction: row;
            gap: 50px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        .square {
            width: 260px;
            height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #f5f0e7;
            border: 4px solid #9e7e5e;
            border-radius: 24px;
            text-decoration: none;
            color: #4a3729;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 10px;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            gap: 10px;
        }
        .square:hover {
            background-color: #e6d7c4;
            transform: scale(1.02);
            border-color: #7c5e42;
        }
        .square:active {
            transform: scale(0.98);
        }
        .square-img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            display: block;
            background-color: transparent;
            padding: 0;
            box-shadow: none;
        }
        .square-text {
            margin-top: 0;
            line-height: 1.3;
        }
        .square.completed {
            background-color: #a5d6a5;
            border-color: #2e7d32;
            position: relative;
        }
        .square.completed::after {
            content: "✓";
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 40px;
            color: #2e7d32;
            font-weight: bold;
        }
        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
            background-color: #ffffff;
            border-radius: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 3px;
            display: flex;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            border: 1px solid #d0d0d0;
        }
        .lang-option {
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            color: #555;
            user-select: none;
            text-align: center;
            min-width: 45px;
        }
        .lang-option.active {
            background-color: #9e7e5e;
            color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .lang-option:not(.active):hover {
            background-color: #f0f0f0;
        }
        .btn-label {
            position: absolute;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 4px 0;
            border-radius: 20px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
            box-sizing: border-box;
        }
        /* ========== 全屏框架（去掉顶部栏，果冻 X 按钮） ========== */
        .frame-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 20000;
            display: none;
            flex-direction: column;
        }
        .frame-content {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .close-frame {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            box-shadow: 0 8px 20px rgba(221, 36, 118, 0.35);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            z-index: 99999;
            transition: transform 0.6s cubic-bezier(0.68, -0.6, 0.32, 1.6),
                        background 0.4s ease,
                        box-shadow 0.4s ease;
        }
        .close-frame::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: inherit;
            filter: blur(10px);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .close-frame .line {
            position: absolute;
            width: 26px;
            height: 4px;
            background-color: #ffffff;
            border-radius: 4px;
            transition: transform 0.6s cubic-bezier(0.68, -0.6, 0.32, 1.6),
                        width 0.3s ease;
        }
        .close-frame .line-1 { transform: rotate(45deg); }
        .close-frame .line-2 { transform: rotate(-45deg); }
        .close-frame:hover {
            transform: scale(1.2) rotate(180deg);
            background: linear-gradient(135deg, #8a2387, #e94057, #f27121);
            box-shadow: 0 12px 28px rgba(233, 64, 87, 0.5);
        }
        .close-frame:hover::before {
            opacity: 0.7;
            transform: scale(1.3);
        }
        .close-frame:hover .line {
            width: 30px;
        }
        .close-frame:active {
            transform: scale(0.9) rotate(180deg);
            transition: transform 0.1s ease;
        }
        /* ========== 原有其他样式（地图、横屏、警告等）继续保留 ========== */

        .map-btn.locked {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }
        @keyframes unlockPulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.7); }
            50% { box-shadow: 0 0 20px 10px rgba(46, 125, 50, 0.5); }
            100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.7); }
        }
        .map-btn.unlock-effect,
        .square.unlock-effect {
            animation: unlockPulse 1s ease-out;
        }
        .sejadin {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10001;
            font-family: 'Poppins', 'Impact', 'Arial Black', sans-serif;
            font-size: 64px;
            font-weight: 900;
            color: #ffd966;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 3px 3px 0 #8b5a2b, 6px 6px 0 rgba(0,0,0,0.3), 0 0 20px rgba(255,215,0,0.8);
            background: linear-gradient(135deg, #f5e7c8 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 6px black);
            pointer-events: none;
            white-space: nowrap;
        }
        .warning-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 30000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .warning-text {
            font-size: 80px;
            font-weight: 900;
            color: red;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff6666;
            animation: warningPop 0.8s ease-in-out 3;
            margin-bottom: 40px;
        }
        @keyframes warningPop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .warning-form-container {
            background-color: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 800px;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .warning-iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
        }
        .submit-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .settings-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10002;
            background-color: #9e7e5e;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
            transition: background-color 0.2s, transform 0.1s;
        }
        .settings-btn:hover {
            background-color: #7c5e42;
            transform: scale(1.05);
        }
        .settings-btn:active {
            transform: scale(0.95);
        }
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40000;
        }
        .settings-square {
            width: 400px;
            height: 400px;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }
        .settings-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 36px;
            cursor: pointer;
            color: #555;
            line-height: 1;
        }
        .settings-close:hover {
            color: #000;
        }
        .settings-item {
            margin: 20px 0;
            width: 100%;
            text-align: center;
        }
        .fullscreen-btn {
            background-color: #9e7e5e;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 40px;
            cursor: pointer;
            width: 80%;
            max-width: 250px;
            margin: 0 auto;
            transition: background-color 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        .fullscreen-btn:hover {
            background-color: #7c5e42;
        }
        .volume-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .volume-label {
            font-size: 20px;
            font-weight: bold;
            color: #4a3729;
            margin-bottom: 10px;
        }
        .volume-slider {
            width: 80%;
            height: 8px;
            -webkit-appearance: none;
            background: #ddd;
            border-radius: 5px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 25px;
            height: 25px;
            background: #9e7e5e;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .volume-slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            background: #9e7e5e;
            border-radius: 50%;
            cursor: pointer;
        }
        body, html {
            margin: 0;
            padding: 0;
            background-color: #FDF6E3;
        }
        .map-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }
        .map-btn {
            position: absolute;
            display: block;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .map-btn img {
            width: 100%;
            display: block;
        }
        .map-btn:hover {
            transform: scale(1.1);
            filter: drop-shadow(0px 0px 15px rgba(255, 255, 255, 1));
        }
        .map-btn:active {
            transform: scale(0.95);
        }
        .item-zhiyi { width: 18%; top: 15%; left: 10%; }
        .item-yinyue { width: 15%; top: 15%; left: 42%; }
        .item-mengya { width: 22%; top: 15%; left: 67%; }
        .item-fuhua { width: 18%; top: 54%; left: 18%; }
        .item-nimi { width: 20%; top: 52%; left: 44%; }
        .item-miaohui { width: 16%; top: 63%; left: 77%; }
        
        /* ========== 横屏强制遮罩 ========== */
        .orientation-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="80px" height="80px"><path d="M0 0h24v24H0z" fill="none"/><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>');
            background-repeat: no-repeat;
            background-position: center 35%;
            background-size: 80px;
            z-index: 50000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        .orientation-message {
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 60px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin-bottom: 20%;
        }
        .orientation-overlay.hidden {
            display: none;
        }
        
        /* ========== 手机横屏优化 ========== */
        @media (max-width: 1024px) and (orientation: landscape) {
            .map-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .map-container .bg-image {
                width: auto;
                min-width: 100%;
                height: auto;
            }
            .map-btn {
                width: 22% !important;
            }
            .item-zhiyi { top: 12%; left: 8%; }
            .item-yinyue { top: 12%; left: 40%; }
            .item-mengya { top: 12%; left: 70%; }
            .item-fuhua { top: 50%; left: 14%; }
            .item-nimi { top: 48%; left: 44%; }
            .item-miaohui { top: 60%; left: 76%; }
            .btn-label {
                font-size: 12px;
                padding: 2px 0;
                white-space: nowrap;
            }
            .sejadin {
                font-size: 36px;
                bottom: 10px;
                left: 10px;
            }
            .lang-switcher {
                top: 10px;
                right: 10px;
                transform: scale(0.8);
            }
            .settings-btn {
                width: 40px;
                height: 40px;
                font-size: 22px;
                top: 10px;
                left: 10px;
            }
            .square {
                width: 200px;
                height: 240px;
                font-size: 1.2rem;
            }
            .square-img {
                width: 140px;
                height: 140px;
            }
            .modal-rectangle {
                padding: 20px;
            }
            .modal-squares {
                gap: 20px;
            }
        }
        
        /* ========== 手机竖屏强制旋转提示 ========== */
        @media (max-width: 768px) and (orientation: portrait) {
            .orientation-overlay:not(.hidden) {
                display: flex;
            }
            .orientation-overlay:not(.hidden) ~ * {
                filter: blur(2px);
                pointer-events: none;
            }
            .orientation-overlay:not(.hidden) {
                filter: none;
                pointer-events: auto;
            }
        }
        .orientation-overlay.hidden ~ * {
            filter: none !important;
            pointer-events: auto !important;
        }
        
        /* ========== 修复警告弹窗滚动 ========== */
        @media (max-width: 768px) {
            .warning-form-container {
                max-height: 85vh;
                overflow-y: auto;
                padding: 15px;
                width: 90%;
            }
            .warning-iframe {
                height: 60vh;
                min-height: 300px;
            }
            .submit-btn {
                margin-top: 15px;
                margin-bottom: 10px;
                font-size: 20px;
                padding: 12px 30px;
            }
        }
        @media (max-width: 480px) {
            .warning-form-container {
                max-height: 80vh;
                padding: 10px;
            }
            .warning-iframe {
                height: 55vh;
            }
            .submit-btn {
                font-size: 18px;
                padding: 10px 20px;
            }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .warning-form-container {
                max-height: 90vh;
            }
            .warning-iframe {
                height: 65vh;
            }
        }

        /* ========== 🆕 新增：封面 / 语言 / 视频 / 迷雾 样式 ========== */
        .cover-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('cover.png') center/cover no-repeat, #1a1a2e;
            z-index: 60000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease;
        }
        .cover-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Start 按钮（图片 + 特效） */
        .start-btn {
            width: 200px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        filter 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(255,215,0,0.5));
        }
        .start-btn:hover {
            transform: scale(1.15) rotate(-2deg);
            filter: drop-shadow(0 0 30px rgba(255,215,0,0.9));
        }
        .start-btn:active {
            transform: scale(0.92);
        }

        /* 语言选择容器（居中） */
        .lang-selection {
            display: none;
            flex-direction: row;
            gap: 40px;
            margin-top: 30px;
        }
        .lang-selection.active {
            display: flex;
        }
        .lang-option-img {
            width: 180px;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        filter 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }
        .lang-option-img:hover {
            transform: scale(1.1) translateY(-8px);
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.7));
        }
        .lang-option-img:active {
            transform: scale(0.95);
        }

        /* 视频播放层 */
        .video-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 65000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .video-layer.active {
            display: flex;
        }
        .video-layer video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* 迷雾过渡层 */
        .mist-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('mist.png') center/cover no-repeat, rgba(255,255,255,0.3);
            z-index: 70000;
            display: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            backdrop-filter: blur(5px);
        }
        .mist-overlay.active {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }
        .mist-overlay.fade-out {
            opacity: 0;
            transition: opacity 2s ease;
        }

        /* 右上角回放按钮（位于语言切换左边） */
        .replay-btn {
            position: fixed;
            top: 20px;
            right: 130px; /* 调整位置，在语言切换左侧 */
            z-index: 10001;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease, background 0.3s ease;
            color: #4a3729;
        }
        .replay-btn:hover {
            transform: scale(1.15);
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .replay-btn:active {
            transform: scale(0.9);
        }

        @media (max-width: 1024px) and (orientation: landscape) {
            .replay-btn {
                top: 10px;
                right: 100px;
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
        }
        /* ========== 新增样式结束 ========== */
    </style>
</head>
<body>

    <!-- ===== 横屏强制遮罩 ===== -->
    <div id="orientationOverlay" class="orientation-overlay">
        <div class="orientation-message">
            🔄 請旋轉為橫向螢幕<br>
            <small>Please rotate to landscape mode</small>
        </div>
    </div>

    <!-- ===== 设置按钮 ===== -->
    <div class="settings-btn" id="settingsBtn">⚙️</div>
    <div id="settingsModal" class="settings-modal">
        <div class="settings-square">
            <div class="settings-close" id="settingsClose">&times;</div>
            <div class="settings-item">
                <button id="fullscreenToggle" class="fullscreen-btn" data-bm="Skrin Penuh" data-zh="全屏">Skrin Penuh</button>
            </div>
            <div class="settings-item volume-control">
                <span id="volumeLabel" class="volume-label" data-bm="Kelantangan" data-zh="音量">Kelantangan</span>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">

    <!-- ======================== JavaScript ======================== -->
    <script>
        (function() {
            'use strict';
            
            // ============ 原有代码（完全保留） ============
            let skipOrientationCheck = false;
            let isMiaohuiActive = false;
            
            const orientationOverlay = document.getElementById('orientationOverlay');
            function checkOrientation() {
                if (skipOrientationCheck) {
                    orientationOverlay.classList.add('hidden');
                    return;
                }
                if (window.innerHeight > window.innerWidth) {
                    orientationOverlay.classList.remove('hidden');
                } else {
                    orientationOverlay.classList.add('hidden');
                }
            }
            checkOrientation();
            window.addEventListener('resize', checkOrientation);
            window.addEventListener('orientationchange', checkOrientation);
            
            document.addEventListener('DOMContentLoaded', function() {
                const frameOverlay = document.getElementById('frameOverlay');
                const frameContent = document.getElementById('frameContent');
                const closeFrameBtn = document.getElementById('closeFrameBtn');
                const langSwitcher = document.getElementById('langSwitcher');
                const langOptions = langSwitcher.querySelectorAll('.lang-option');
                const mapContainer = document.getElementById('mapContainer');

                const langData = {
                    'yinyue-left': { bm: { href: 'https://jatanegaravb.vercel.app/', text: 'Jata Negara' }, zh: { href: 'https://jatanegaravc.vercel.app/', text: '国徽' } },
                    'yinyue-right': { bm: { href: 'https://jalurgemilangvb.vercel.app/', text: 'Jalur Gemilang' }, zh: { href: 'https://jalurgemilangvc.vercel.app/', text: '辉煌条纹' } },
                    'fuhua-left': { bm: { href: 'https://read.bookcreator.com/bWyhwslXjFdj06yZsJdAdlqAlyt1/0JK5xn-5RMKw6ns6jP2mUA', text: 'Jata Negara' }, zh: { href: 'https://read.bookcreator.com/bWyhwslXjFdj06yZsJdAdlqAlyt1/-Nd6TlJvR-Kx6RowvY9E-Q', text: '国徽' } },
                    'fuhua-right': { bm: { href: 'https://read.bookcreator.com/bWyhwslXjFdj06yZsJdAdlqAlyt1/dckzpqEvQCen76Hzq-BKhg', text: 'Jalur Gemilang' }, zh: { href: 'https://read.bookcreator.com/bWyhwslXjFdj06yZsJdAdlqAlyt1/KP6FKS5aT-2FrQQ5E8f6NA', text: '辉煌条纹' } },
                    'nimi-left': { bm: { href: 'https://jatanegara-vb.vercel.app/', text: 'Jata Negara' }, zh: { href: 'https://jatanegara-vc.vercel.app/', text: '国徽' } },
                    'nimi-right': { bm: { href: 'https://jalurgemilang-vb.vercel.app/', text: 'Jalur Gemilang' }, zh: { href: 'https://jalurgemilang-vc.vercel.app/', text: '辉煌条纹' } }
                };
                const leftRightIds = Object.keys(langData);
                let currentLang = 'bm';
                const order = ['zhiyi', 'fuhua', 'yinyue', 'nimi', 'mengya', 'miaohui'];
                let tasks = {
                    zhiyi: { completed: false, unlocked: true },
                    fuhua: { completed: false, unlocked: false, subtasks: { left: false, right: false } },
                    yinyue: { completed: false, unlocked: false, subtasks: { left: false, right: false } },
                    nimi: { completed: false, unlocked: false, subtasks: { left: false, right: false } },
                    mengya: { completed: false, unlocked: false },
                    miaohui: { completed: false, unlocked: false }
                };
                let currentTask = null;
                let currentSub = null;

                function setLanguage(lang) {
                    if (lang === currentLang) return;
                    leftRightIds.forEach(id => {
                        const el = document.getElementById(id);
                        if (el) {
                            const data = langData[id][lang];
                            if (data) {
                                el.href = data.href;
                                const textSpan = el.querySelector('.square-text');
                                if (textSpan) textSpan.textContent = data.text;
                            }
                        }
                    });
                    updateSettingsLanguage(lang);
                    currentLang = lang;
                }

                langOptions.forEach(option => {
                    option.addEventListener('click', function() {
                        const lang = this.dataset.lang;
                        if (lang === currentLang) return;
                        langOptions.forEach(opt => opt.classList.remove('active'));
                        this.classList.add('active');
                        setLanguage(lang);
                    });
                });

                const modalConfigs = [
                    { btn: '.item-yinyue', modal: 'yinyueModal' },
                    { btn: '.item-fuhua', modal: 'fuhuaModal' },
                    { btn: '.item-nimi', modal: 'nimiModal' }
                ];
                modalConfigs.forEach(config => {
                    const btn = document.querySelector(config.btn);
                    const modal = document.getElementById(config.modal);
                    if (btn && modal) {
                        btn.addEventListener('click', function(e) {
                            e.preventDefault();
                            if (btn.classList.contains('locked')) return;
                            modal.style.display = 'flex';
                        });
                        modal.addEventListener('click', function(e) {
                            if (e.target === modal) modal.style.display = 'none';
                        });
                        const rect = modal.querySelector('.modal-rectangle');
                        if (rect) rect.addEventListener('click', e => e.stopPropagation());
                    }
                });

                const buttonLabels = [
                    { selector: '.item-zhiyi', text: 'Ujian Pra' },
                    { selector: '.item-yinyue', text: 'CITRA' },
                    { selector: '.item-mengya', text: 'Ujian Pos' },
                    { selector: '.item-fuhua', text: 'HistoriVerse' },
                    { selector: '.item-nimi', text: 'SUAR' },
                    { selector: '.item-miaohui', text: 'Edu-HamQuest' }
                ];
                const labelElements = [];
                function createLabels() {
                    buttonLabels.forEach(item => {
                        const btn = document.querySelector(item.selector);
                        if (!btn) return;
                        let existing = labelElements.find(lbl => lbl.btn === btn);
                        if (existing) return;
                        const label = document.createElement('div');
                        label.className = 'btn-label';
                        label.textContent = item.text;
                        mapContainer.appendChild(label);
                        labelElements.push({ btn, label, offsetY: (item.selector === '.item-mengya') ? -4 : -2 });
                    });
                }
                function updateLabelPositions() {
                    labelElements.forEach(({ btn, label, offsetY }) => {
                        const btnRect = btn.getBoundingClientRect();
                        const containerRect = mapContainer.getBoundingClientRect();
                        const left = btnRect.left - containerRect.left;
                        const top = btnRect.top - containerRect.top + btn.offsetHeight + offsetY;
                        label.style.left = left + 'px';
                        label.style.top = top + 'px';
                        label.style.width = btn.offsetWidth + 'px';
                    });
                }
                createLabels();
                updateLabelPositions();
                window.addEventListener('load', function() { updateLabelPositions(); });
                window.addEventListener('resize', function() { updateLabelPositions(); });
                const bgImage = document.querySelector('.bg-image');
                if (bgImage && !bgImage.complete) bgImage.addEventListener('load', () => updateLabelPositions());
                const allBtnImages = document.querySelectorAll('.map-btn img');
                let pendingImages = 0;
                allBtnImages.forEach(img => { if (!img.complete) { pendingImages++; img.addEventListener('load', () => { pendingImages--; if (pendingImages === 0) updateLabelPositions(); }); } });
                if (pendingImages === 0) updateLabelPositions();

                function updateUI() {
                    document.querySelectorAll('.map-btn').forEach(btn => {
                        let taskId = null;
                        if (btn.classList.contains('item-zhiyi')) taskId = 'zhiyi';
                        else if (btn.classList.contains('item-yinyue')) taskId = 'yinyue';
                        else if (btn.classList.contains('item-mengya')) taskId = 'mengya';
                        else if (btn.classList.contains('item-fuhua')) taskId = 'fuhua';
                        else if (btn.classList.contains('item-nimi')) taskId = 'nimi';
                        else if (btn.classList.contains('item-miaohui')) taskId = 'miaohui';
                        if (taskId && tasks[taskId]) btn.classList.toggle('locked', !tasks[taskId].unlocked);
                    });
                    const squareMap = { 'yinyue-left':'yinyue', 'yinyue-right':'yinyue', 'fuhua-left':'fuhua', 'fuhua-right':'fuhua', 'nimi-left':'nimi', 'nimi-right':'nimi' };
                    for (let id in squareMap) {
                        const el = document.getElementById(id);
                        if (!el) continue;
                        const task = squareMap[id];
                        const sub = id.includes('left') ? 'left' : 'right';
                        if (tasks[task]?.subtasks?.[sub]) el.classList.add('completed');
                        else el.classList.remove('completed');
                    }
                }
                function addUnlockEffect(taskId) {
                    const selectorMap = { 'zhiyi':'.item-zhiyi', 'yinyue':'.item-yinyue', 'mengya':'.item-mengya', 'fuhua':'.item-fuhua', 'nimi':'.item-nimi', 'miaohui':'.item-miaohui' };
                    const el = document.querySelector(selectorMap[taskId]);
                    if (el) { el.classList.add('unlock-effect'); setTimeout(() => el.classList.remove('unlock-effect'), 1000); }
                }
                function unlockNext(completedTaskId) {
                    const idx = order.indexOf(completedTaskId);
                    if (idx === -1 || idx === order.length - 1) return;
                    const next = order[idx + 1];
                    if (tasks[next]) { tasks[next].unlocked = true; addUnlockEffect(next); }
                    updateUI();
                }
                function checkFangCompletion(fangId) {
                    if (!tasks[fangId]?.subtasks) return false;
                    if (tasks[fangId].subtasks.left && tasks[fangId].subtasks.right && !tasks[fangId].completed) {
                        tasks[fangId].completed = true;
                        unlockNext(fangId);
                        return true;
                    }
                    return false;
                }
                function completeTask(taskId, sub) {
                    if (!tasks[taskId]) return;
                    if (sub) {
                        if (tasks[taskId].subtasks && !tasks[taskId].subtasks[sub]) {
                            tasks[taskId].subtasks[sub] = true;
                            updateUI();
                            checkFangCompletion(taskId);
                        }
                    } else {
                        if (!tasks[taskId].completed) {
                            tasks[taskId].completed = true;
                            if (taskId === 'mengya') showWarningAndForm();
                            else unlockNext(taskId);
                            updateUI();
                        }
                    }
                }

                const warningOverlay = document.getElementById('warningOverlay');
                const warningText = document.getElementById('warningText');
                const warningFormContainer = document.getElementById('warningFormContainer');
                const warningIframe = document.getElementById('warningIframe');
                const warningSubmitBtn = document.getElementById('warningSubmitBtn');
                function showWarningAndForm() {
                    fadeOutMusic();
                    warningOverlay.style.display = 'flex';
                    warningText.style.display = 'block';
                    warningFormContainer.style.display = 'none';
                    warningIframe.src = 'https://docs.google.com/forms/d/e/1FAIpQLSd-UvZD_LZ-n5bEvucCycaI85K5jJTHc8_IAz8yvIryIFkD2w/viewform?usp=header';
                    setTimeout(() => { warningText.style.display = 'none'; warningFormContainer.style.display = 'flex'; }, 2400);
                }
                warningSubmitBtn.addEventListener('click', function() {
                    warningOverlay.style.display = 'none';
                    warningIframe.src = 'about:blank';
                    fadeInMusic();
                    unlockNext('mengya');
                });

                const externalLinks = document.querySelectorAll('a[target="_blank"]');
                externalLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        const taskId = this.dataset.task;
                        const sub = this.dataset.sub;
                        
                        if (taskId === 'miaohui') {
                            skipOrientationCheck = true;
                            isMiaohuiActive = true;
                            checkOrientation();
                        } else {
                            skipOrientationCheck = false;
                            isMiaohuiActive = false;
                            checkOrientation();
                        }
                        
                        if (taskId) {
                            if (!tasks[taskId]?.unlocked) {
                                alert('此關卡尚未解鎖，請先完成上一個任務。');
                                if (taskId === 'miaohui') {
                                    skipOrientationCheck = false;
                                    isMiaohuiActive = false;
                                    checkOrientation();
                                }
                                return;
                            }
                            currentTask = taskId;
                            currentSub = sub;
                        } else {
                            currentTask = null;
                            currentSub = null;
                        }
                        const url = this.href;
                        if (url) {
                            frameContent.src = url;
                            frameOverlay.style.display = 'flex';
                            fadeOutMusic();
                        }
                    });
                });
                
                closeFrameBtn.addEventListener('click', function() {
                    if (currentTask) {
                        completeTask(currentTask, currentSub);
                        currentTask = null;
                        currentSub = null;
                    }
                    frameOverlay.style.display = 'none';
                    frameContent.src = 'about:blank';
                    fadeInMusic();
                    
                    if (isMiaohuiActive) {
                        skipOrientationCheck = false;
                        isMiaohuiActive = false;
                        checkOrientation();
                    }
                });
                
                updateUI();

                const bgMusic = document.getElementById('bgMusic');
                const settingsBtn = document.getElementById('settingsBtn');
                const settingsModal = document.getElementById('settingsModal');
                const settingsClose = document.getElementById('settingsClose');
                const fullscreenToggle = document.getElementById('fullscreenToggle');
                const volumeSlider = document.getElementById('volumeSlider');
                const volumeLabelElem = document.getElementById('volumeLabel');
                bgMusic.volume = 0.5;
                let musicStarted = false;
                function tryPlayMusic() { if (!musicStarted) { bgMusic.play().then(() => { musicStarted = true; }).catch(e => console.log('自动播放受阻')); } }
                document.addEventListener('click', function once() { tryPlayMusic(); document.removeEventListener('click', once); }, { once: true });
                settingsBtn.addEventListener('click', () => { settingsModal.style.display = 'flex'; });
                settingsClose.addEventListener('click', () => { settingsModal.style.display = 'none'; });
                settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) settingsModal.style.display = 'none'; });
                fullscreenToggle.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else if (document.exitFullscreen) document.exitFullscreen(); });
                volumeSlider.addEventListener('input', function() { bgMusic.volume = this.value; });
                function updateSettingsLanguage(lang) {
                    const fullBtn = document.getElementById('fullscreenToggle');
                    const volLab = document.getElementById('volumeLabel');
                    if (lang === 'bm') { fullBtn.textContent = fullBtn.dataset.bm; volLab.textContent = volLab.dataset.bm; }
                    else { fullBtn.textContent = fullBtn.dataset.zh; volLab.textContent = volLab.dataset.zh; }
                }
                updateSettingsLanguage(currentLang);
                let fadeInterval = null;
                function fadeOutMusic() { if (fadeInterval) clearInterval(fadeInterval); const step = 0.05; fadeInterval = setInterval(() => { let cur = bgMusic.volume; if (cur <= step) { bgMusic.volume = 0; clearInterval(fadeInterval); fadeInterval = null; } else { bgMusic.volume = Math.max(0, cur - step); } }, 50); }
                function fadeInMusic() { if (fadeInterval) clearInterval(fadeInterval); const target = parseFloat(volumeSlider.value); const step = 0.05; fadeInterval = setInterval(() => { let cur = bgMusic.volume; if (cur >= target - step) { bgMusic.volume = target; clearInterval(fadeInterval); fadeInterval = null; } else { bgMusic.volume = Math.min(target, cur + step); } }, 50); }
                
                if (warningFormContainer) {
                    const applyScrollFix = () => {
                        if (window.innerWidth <= 768) {
                            warningFormContainer.style.maxHeight = '85vh';
                            warningFormContainer.style.overflowY = 'auto';
                            const iframe = warningFormContainer.querySelector('.warning-iframe');
                            if (iframe) iframe.style.height = '60vh';
                        }
                    };
                    applyScrollFix();
                    window.addEventListener('resize', applyScrollFix);
                }

                // ============ 🆕 新增功能：封面 / 视频 / 迷雾 / 回放 ============
                const coverOverlay = document.getElementById('coverOverlay');
                const startBtn = document.getElementById('startBtn');
                const langSelection = document.getElementById('langSelection');
                const langOptionImgs = langSelection.querySelectorAll('.lang-option-img');
                const videoLayer = document.getElementById('videoLayer');
                const introVideo = document.getElementById('introVideo');
                const mistOverlay = document.getElementById('mistOverlay');
                const replayBtn = document.getElementById('replayBtn');

                let isIntroPlaying = false;       // 防止重复点击
                let isFromReplay = false;         // 标记是否来自回放（不触发迷雾过渡）

                // 播放视频函数（通用）
                function playIntroVideo(lang, fromReplay = false) {
                    if (isIntroPlaying) return;
                    isIntroPlaying = true;
                    isFromReplay = fromReplay;

                    // 暂停背景音乐
                    bgMusic.pause();

                    // 设置视频源
                    const src = lang === 'zh' ? 'intro-zh.mp4' : 'intro-bm.mp4';
                    introVideo.src = src;
                    introVideo.load();

                    // 显示视频层
                    videoLayer.classList.add('active');

                    // 尝试自动播放
                    introVideo.play().catch(err => {
                        console.warn('视频自动播放被阻止，用户需手动点击播放');
                        // 可在此添加一个简单的“点击播放”提示，但这里不处理
                    });
                }

                // 视频结束后的处理
                function onVideoEnded() {
                    if (isFromReplay) {
                        // 回放模式：直接关闭视频层，不触发迷雾，地图保持可见
                        videoLayer.classList.remove('active');
                        introVideo.pause();
                        introVideo.currentTime = 0;
                        isIntroPlaying = false;
                        // 恢复背景音乐
                        bgMusic.play().catch(() => {});
                    } else {
                        // 开场模式：触发迷雾过渡 → 隐藏封面 → 显示地图
                        mistOverlay.classList.add('active');
                        // 2.5秒后迷雾淡出并隐藏封面
                        setTimeout(() => {
                            mistOverlay.classList.add('fade-out');
                            setTimeout(() => {
                                mistOverlay.classList.remove('active', 'fade-out');
                                // 隐藏封面
                                coverOverlay.classList.add('hidden');
                                // 隐藏视频层
                                videoLayer.classList.remove('active');
                                introVideo.pause();
                                introVideo.currentTime = 0;
                                isIntroPlaying = false;
                                // 恢复背景音乐
                                bgMusic.play().catch(() => {});
                                // 重置封面状态（以便下次回放）
                                // 但保留封面隐藏状态
                            }, 2000);
                        }, 1500);
                    }
                }

                // 监听视频结束事件
                introVideo.addEventListener('ended', onVideoEnded);

                // ---------- 封面流程 ----------
                // 点击 Start → 隐藏 Start，显示语言选择
                startBtn.addEventListener('click', function() {
                    startBtn.style.display = 'none';
                    langSelection.classList.add('active');
                });

                // 点击语言选项 → 播放视频（开场模式）
                langOptionImgs.forEach(img => {
                    img.addEventListener('click', function() {
                        const lang = this.dataset.lang;
                        // 隐藏语言选择（但不隐藏Start，保持状态）
                        langSelection.classList.remove('active');
                        playIntroVideo(lang, false);
                    });
                });

                // ---------- 回放按钮（右上角） ----------
                replayBtn.addEventListener('click', function() {
                    // 如果封面还在显示（即首次进入尚未完成开场），则不允许回放
                    if (!coverOverlay.classList.contains('hidden')) {
                        alert('请先完成开场影片。');
                        return;
                    }
                    // 显示语言选择（浮在封面上，但封面已隐藏，我们可以动态创建临时选择）
                    // 为简化，直接复用语言选择弹窗（但封面隐藏了，我们可以在页面中心创建一个临时弹窗）
                    // 更好的做法：创建一个独立的语言选择浮层，这里我们直接使用一个简单的提示
                    // 由于用户要求“点击后出现两个语言”，我们直接显示之前隐藏的 langSelection 并置于顶层
                    // 但 langSelection 是 cover 的子元素，现在 cover 隐藏了，无法显示。
                    // 方案：在 body 中创建一个新的临时浮层，或者将 langSelection 移到 body 下。
                    // 为了简便，我们动态创建一个浮层，或者重新显示 cover 但以透明背景？
                    // 我这里将 langSelection 复制一份到 body，或使用一个全局弹窗。
                    // 我采用动态创建对话框的方式，简洁明了。
                    showReplayLangDialog();
                });

                // 回放专用的语言选择对话框（独立于封面）
                function showReplayLangDialog() {
                    // 如果已有对话框则移除
                    const existing = document.querySelector('.replay-dialog');
                    if (existing) existing.remove();

                    const dialog = document.createElement('div');
                    dialog.className = 'replay-dialog';
                    dialog.style.cssText = `
                        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                        background: rgba(0,0,0,0.6); z-index: 80000;
                        display: flex; flex-direction: column; align-items: center; justify-content: center;
                        backdrop-filter: blur(4px);
                    `;
                    const container = document.createElement('div');
                    container.style.cssText = `
                        display: flex; flex-direction: row; gap: 40px;
                        background: rgba(255,255,255,0.1); padding: 40px; border-radius: 30px;
                    `;
                    // 创建两个语言选项（使用同样的图片）
                    const langList = [
                        { lang: 'zh', src: 'lang_zh.png' },
                        { lang: 'bm', src: 'lang_bm.png' }
                    ];
                    langList.forEach(item => {
                        const img = document.createElement('img');
                        img.src = item.src;
                        img.alt = item.lang;
                        img.style.cssText = `
                            width: 180px; cursor: pointer; transition: transform 0.3s ease;
                            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
                        `;
                        img.onmouseover = function() { this.style.transform = 'scale(1.1)'; };
                        img.onmouseout = function() { this.style.transform = 'scale(1)'; };
                        img.onclick = function() {
                            dialog.remove();
                            playIntroVideo(item.lang, true);  // 回放模式
                        };
                        container.appendChild(img);
                    });
                    dialog.appendChild(container);
                    // 点击背景关闭
                    dialog.addEventListener('click', function(e) {
                        if (e.target === dialog) dialog.remove();
                    });
                    document.body.appendChild(dialog);
                }

                // ---------- 额外：如果用户点击语言选择后想取消，可点击背景关闭 ----------
                // 但封面中的语言选择没有关闭按钮，用户只能选择语言或刷新。符合设计。

            });
        })();
    </script>
</body>
</html>
